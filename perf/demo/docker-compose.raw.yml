# The floor of the demo, over docker-compose.yml of the example: the same
# routes on Starlette alone, in the image of the application of the role,
# its Starlette and its server, the code of the floor the stand's,
# STAND_DIR, mounted.
services:
  app:
    image: demo-app:perf
  raw:
    image: demo-app:perf
    pull_policy: never
    depends_on: [app]
    command: [raw:app, --host, 0.0.0.0, --port, "8000", --no-access-log]
    volumes:
      - ${STAND_DIR:?the directory of the stand}/raw:/srv/raw:ro
    ports:
      - "127.0.0.1:${DEMO_TEST_DEMO_RAW_PORT:-8072}:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import socket; socket.create_connection(("localhost", 8000), 1)
      interval: 2s
      timeout: 5s
      retries: 30
