# The floor of the demo, over docker-compose.yml of the example: the same
# routes on Starlette alone, an image of its own at the versions of the demo
# of the role, the code of the floor the stand's, STAND_DIR.
services:
  bare:
    build:
      context: ../..
      dockerfile: ${STAND_DIR:?the directory of the stand}/bare/Dockerfile
      additional_contexts:
        stand: ${STAND_DIR}
      args:
        PYTHON: ${DEMO_PYTHON:-}
    depends_on: [app]
    ports:
      - "127.0.0.1:${PERF_TEST_DEMO_BARE_PORT:-8072}:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import socket; socket.create_connection(("localhost", 8000), 1)
      interval: 2s
      timeout: 5s
      retries: 30
